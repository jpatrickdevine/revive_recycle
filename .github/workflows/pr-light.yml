name: pr-checks
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  pr-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/validate-pr-body.py
  